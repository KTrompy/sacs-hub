<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SACS Alumni Hub</title>
    <meta name="description" content="A community platform for SACS Old Boys: an alumni directory and map, a house feed, events, a job board and 1:1 messaging. Spectemur Agendo · Since 1829." />
    <meta name="theme-color" content="#002F5F" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph / social link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SACS Alumni Hub" />
    <meta property="og:title" content="SACS Alumni Hub" />
    <meta property="og:description" content="A community platform for SACS Old Boys: directory, feed, events, jobs and messaging. Spectemur Agendo · Since 1829." />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SACS Alumni Hub" />
    <meta name="twitter:description" content="A community platform for SACS Old Boys: directory, feed, events, jobs and messaging." />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Display/heading font is now the system Helvetica stack (see --display
         in styles.css) — no webfont to load for it. Inter (body text) still
         comes from Google Fonts. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Cloudflare Turnstile (CAPTCHA on sign up / sign in / password reset) -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
